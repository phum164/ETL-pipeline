name: Test and publish image

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: data-engineering-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: warehouse_db_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d warehouse_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify warehouse SQL
        env:
          PGPASSWORD: postgres
        run: |
          for file in warehouse/001_bootstrap.sql warehouse/002_transform.sql warehouse/003_marts.sql warehouse/004_verify.sql; do
            psql -h 127.0.0.1 -U postgres -d warehouse_db_test -v ON_ERROR_STOP=1 -f "$file"
          done
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/phum164/etl-pipeline:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
      - if: github.event_name == 'push'
        run: echo 'ETL_IMAGE=ghcr.io/phum164/etl-pipeline@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
